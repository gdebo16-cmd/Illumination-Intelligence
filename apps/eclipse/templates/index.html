<!DOCTYPE html>
<html lang="en" data-brand="{{ brand_slug }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eclipse — Illumination Intelligence</title>
    <meta
      name="description"
      content="Eclipse stub in Illumination Intelligence. Product not defined. Locked banner is in place."
    />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/design-tokens/tokens.css" />
    <link rel="stylesheet" href="/shared-ui/suite.css" />
    <link rel="stylesheet" href="/static/brand.css" />
  </head>
  <body>
    <div class="frame">
      <header class="top">
        <p class="suite">Illumination Intelligence</p>
        <p class="port">:{{ port }}</p>
      </header>
      <main class="hero">
        <p class="hello">Hello</p>
        <h1>{{ brand_name }}</h1>
        <p class="intent">
          A sibling brand with no product defined yet. Red and gunmetal are
          reserved here until the intent is written down.
        </p>
      </main>
      <figure class="banner-slot has-art">
        <img
          class="banner-art"
          src="/static/banner.png"
          alt="Eclipse"
          width="2560"
          height="300"
        />
      </figure>
      <footer class="foot">
        <p>Stub on port {{ port }}. Nothing here calls a model.</p>
        <p>
          <code>uvicorn app.main:app --host 0.0.0.0 --port {{ port }} --reload</code>
        </p>
      </footer>
    </div>
  </body>
</html>
