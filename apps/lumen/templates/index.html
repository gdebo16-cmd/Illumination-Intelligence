<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="/static/icon-512.png">
    <meta name="apple-mobile-web-app-title" content="Lumen Intelligence">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f12">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Lumen Intelligence — Illumination Intelligence</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
    <header>
        <div class="header-container">
            <img src="{{ url_for('static', path='/banner.png') }}" alt="Banner" class="banner">
        </div>
        <button id="toggle-sidebar-button">☰</button>
    </header>
    

    <div id="chat"></div>
    <div class="input-container">
        <input id="msg" placeholder="Type a message..." autofocus>
        <button onclick="send()">Send</button>
        <button id="clear-btn" onclick="clearChat()">Clear History</button>
        <div class="header-container">
            <select id="model-selector">
                <option value="llama3.1:8b" selected>Small Llama</option>
                <option value="qwen3.5:9b">Coding Buddy</option>          
                <option value="deepseek-r1:14b">Thinking Buddy</option>
                <option value="qwen3-coder:30b">Big City Fish Code Buddy</option>
            </select> 
        </div>
    </div>
    <div class="sidebar" id="sidebar">
        <ul id="conversation-list">
          
        </ul>
      </div>
    <footer>
        <p>© 2026 DeBo Dynamics. All rights reserved.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <script src="{{ url_for('static', path='/script.js') }}"></script>
</body>
</html>
