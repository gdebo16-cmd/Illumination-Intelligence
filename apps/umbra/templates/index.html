<!DOCTYPE html>
<html lang="en" data-brand="{{ brand_slug }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Umbra — Illumination Intelligence</title>
    <meta
      name="description"
      content="Umbra stub in Illumination Intelligence. Product not defined. Locked banner is in place."
    />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/design-tokens/tokens.css" />
    <link rel="stylesheet" href="/shared-ui/suite.css" />
    <link rel="stylesheet" href="/static/brand.css" />
  </head>

  <body>
    <figure class="banner-slot has-art">
      <img
        class="banner-art"
        src="/static/banner.png"
        alt="Umbra"
      />
    </figure>
    <div class="frame">
      <header class="top">
        <p class="suite">Illumination Intelligence</p>
        <p class="intent">Turn your flicker into a flame.</p>
      </header>
      <main class="hero">
        <h1>{{ brand_name }}</h1>
      </main>

      <footer class="foot">
        <p>Stub on port {{ port }}. Nothing here calls a model.</p>
        <p>
          <code>uvicorn app.main:app --host 0.0.0.0 --port {{ port }} --reload</code>
        </p>
      </footer>
    </div>
  </body>
</html>
