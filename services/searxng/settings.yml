# SearXNG settings for Umbra. Everything not listed here uses SearXNG's defaults.
use_default_settings: true

general:
  instance_name: "Umbra search"

server:
  # Only Umbra on this PC talks to it, so the bot-protection limiter isn't needed.
  limiter: false
  image_proxy: false

search:
  # Umbra asks for JSON; html keeps the normal web page working too.
  formats:
    - html
    - json
  # 1 = moderate safe search.
  safe_search: 1
